<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Monitor</title>
<style>
body { background: #070b14; color: #e7edf7; font-family: sans-serif; padding: 1rem; line-height: 1.5; }
input, select, button { background: #1a202c; color: #e7edf7; border: 1px solid #22d3ee; padding: 0.5rem; margin: 0.2rem 0; width: 100%; box-sizing: border-box; }
button { cursor: pointer; color: #22d3ee; font-weight: bold; }
.card { border: 1px solid #22d3ee; padding: 1rem; margin-top: 1rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #22d3ee; padding: 0.5rem; text-align: left; }
.error { color: #ff6b6b; font-size: 0.8rem; }
#confirm-panel { display: none; margin-top: 1rem; padding: 1rem; border: 1px solid #ff6b6b; background: #2d1a1a; }
</style>
</head>
<body>
<h2>Operations Monitor</h2>
<p>Report Date: 2026-11-07</p>
<div id="input-area">
<input type="text" id="tid" placeholder="Task ID (e.g., T101)">
<input type="text" id="tname" placeholder="Task Name">
<input type="text" id="oid" placeholder="Owner ID">
<input type="date" id="tdate">
<select id="tstatus"><option value="">Status</option><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Blocked">Blocked</option><option value="Completed">Completed</option></select>
<select id="tpriority"><option value="">Priority</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select>
<button onclick="addTask()">Add Task</button>
<button onclick="showConfirm()" style="color: #ff6b6b;">Clear All Tasks</button>
<div id="confirm-panel">
<p>Are you sure you want to delete all task records?</p>
<button onclick="clearAllTasks()" style="color: #ff6b6b;">Confirm Delete</button>
<button onclick="hideConfirm()">Cancel</button>
</div>
<div id="msg" class="error"></div>
</div>
<div id="results" class="card">
<h3>KPIs</h3>
<div id="kpi">Tasks: 0 | Completed: 0%</div>
<h3>Alerts</h3>
<ul id="alerts"></ul>
<h3>Task Table</h3>
<table id="taskTable"><tr><th>Task ID</th><th>Task Name</th><th>Owner ID</th><th>Due Date</th><th>Status</th><th>Priority</th></tr></table>
<h3>AI Summary & Actions</h3>
<div id="ai-summary"></div>
</div>
<script>
let tasks = [];
const REPORT_DATE = new Date('2026-11-07');
function addTask() {
const id = document.getElementById('tid').value.trim();
const name = document.getElementById('tname').value.trim();
const owner = document.getElementById('oid').value.trim();
const dateVal = document.getElementById('tdate').value;
const status = document.getElementById('tstatus').value;
const priority = document.getElementById('tpriority').value;
const msg = document.getElementById('msg');
if (!id || tasks.find(t => t.id === id)) { msg.innerText = "Invalid or duplicate ID."; return; }
if (!status) { msg.innerText = "Status required."; return; }
if (!priority) { msg.innerText = "Priority required."; return; }
tasks.push({ id, name, owner, date: dateVal ? new Date(dateVal) : null, status, priority });
msg.innerText = ""; updateUI();
}
function showConfirm() { document.getElementById('confirm-panel').style.display = 'block'; }
function hideConfirm() { document.getElementById('confirm-panel').style.display = 'none'; }
function clearAllTasks() {
tasks = [];
document.getElementById('tid').value = '';
document.getElementById('tname').value = '';
document.getElementById('oid').value = '';
document.getElementById('tdate').value = '';
document.getElementById('tstatus').value = '';
document.getElementById('tpriority').value = '';
document.getElementById('msg').innerText = "";
hideConfirm();
updateUI();
}
function updateUI() {
const table = document.getElementById('taskTable');
const kpi = document.getElementById('kpi');
const alerts = document.getElementById('alerts');
const ai = document.getElementById('ai-summary');
table.innerHTML = '<tr><th>Task ID</th><th>Task Name</th><th>Owner ID</th><th>Due Date</th><th>Status</th><th>Priority</th></tr>';
alerts.innerHTML = '';
let completed = 0, overdue = 0, blocked = 0, missing = 0;
tasks.forEach(t => {
table.innerHTML += `<tr><td>${t.id}</td><td>${t.name}</td><td>${t.owner}</td><td>${t.date ? t.date.toISOString().split('T')[0] : 'None'}</td><td>${t.status}</td><td>${t.priority}</td></tr>`;
if (t.status === 'Completed') completed++;
if (t.status === 'Blocked') blocked++;
if (!t.date) missing++;
if (t.date && t.date < REPORT_DATE && t.status !== 'Completed') overdue++;
});
kpi.innerText = `Tasks: ${tasks.length} | Completed: ${tasks.length ? Math.round((completed/tasks.length)*100) : 0}%`;
if (overdue) alerts.innerHTML += `<li>Overdue: ${overdue} tasks</li>`;
if (blocked) alerts.innerHTML += `<li>Blocked: ${blocked} tasks</li>`;
if (missing) alerts.innerHTML += `<li>Missing date: ${missing} tasks</li>`;
ai.innerText = tasks.length > 0 ? `Summary: ${tasks.length} tasks monitored. Suggested Action: Review ${blocked} blocked tasks and ${overdue} overdue items immediately. Approve?` : "No data available.";
}
</script>
</body>
</html>
